{% extends 'shop/base.html' %} {% load static %} {% block content %}
<div class="product-detail">
    <div class="product-detail-image">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}"> {% else %}
        <div class="no-image">
            <i class="fas fa-image"></i>
            <span>Немає фото</span>
        </div>
        {% endif %}
    </div>
    <div class="product-detail-info">
        <h1>{{ product.name }}</h1>
        <p class="price">{{ product.price }} грн</p>
        <p class="description">{{ product.description }}</p>
        <form action="{% url 'shop:cart_add' product.id %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Додати в кошик</button>
        </form>
    </div>
</div>

<style>
    .product-detail {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
    }
    
    .product-detail-image {
        flex: 1;
        min-width: 300px;
    }
    
    .product-detail-image img {
        width: 100%;
        border-radius: 10px;
    }
    
    .product-detail-info {
        flex: 1;
    }
    
    .product-detail-info h1 {
        color: #8B9A46;
        margin-bottom: 20px;
    }
    
    .product-detail-info .price {
        font-size: 28px;
        font-weight: bold;
        color: #8B9A46;
        margin-bottom: 20px;
    }
    
    .product-detail-info .description {
        line-height: 1.6;
        margin-bottom: 30px;
    }
    
    .no-image {
        width: 100%;
        height: 300px;
        background: #2a2a2a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
    }
    
    .no-image i {
        font-size: 64px;
        color: #6B7A30;
    }
</style>
{% endblock %}
