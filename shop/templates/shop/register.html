{% extends 'shop/base.html' %} {% block title %}Реєстрація{% endblock %} {% block content %}
<div class="form-container">
    <h2>Реєстрація</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Ім'я користувача</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-submit">Зареєструватися</button>
    </form>
    <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
</div>

<style>
    .form-container {
        max-width: 400px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 15px;
    }
    
    .btn-submit {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
</style>
{% endblock %}
