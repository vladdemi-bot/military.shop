{% extends 'shop/base.html' %} {% block title %}{{ article.title }}{% endblock %} {% block content %}
<div class="detail-container">
    <article class="detail-article">
        <div class="detail-header">
            <h1>{{ article.title }}</h1>
            <div class="detail-info">
                <span><i class="fas fa-user"></i> Автор: {{ article.author.username }}</span>
                <span><i class="fas fa-calendar-alt"></i> Дата: {{ article.created_at|date:"d.m.Y H:i" }}</span>
            </div>
        </div>

        <div class="detail-body">
            {{ article.content|linebreaks }}
        </div>

        <div class="detail-footer">
            <a href="{% url 'articles' %}" class="btn-back">
                <i class="fas fa-arrow-left"></i> Назад до статей
            </a>
        </div>
    </article>
</div>

<style>
    .detail-container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .detail-article {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .detail-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
    }
    
    .detail-header h1 {
        margin-bottom: 1rem;
    }
    
    .detail-info {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
        opacity: 0.9;
    }
    
    .detail-body {
        padding: 2rem;
        line-height: 1.8;
    }
    
    .detail-footer {
        padding: 1.5rem;
        border-top: 1px solid #e0e0e0;
    }
</style>
{% endblock %}
