{% extends 'shop/base.html' %} {% block title %}Вхід{% endblock %} {% block content %}
<div class="form-container">
    <div class="form-header">
        <i class="fas fa-sign-in-alt"></i>
        <h2>Вхід в акаунт</h2>
        <p>Введіть свої дані для входу</p>
    </div>

    <form method="post" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
            <label><i class="fas fa-user"></i> Ім'я користувача</label>
            <input type="text" name="username" required placeholder="Введіть ваше ім'я">
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> Пароль</label>
            <input type="password" name="password" required placeholder="Введіть пароль">
        </div>

        <div class="form-options">
            <label class="checkbox">
                <input type="checkbox"> Запам'ятати мене
            </label>
            <a href="#" class="forgot-password">Забули пароль?</a>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-sign-in-alt"></i> Увійти
        </button>
    </form>

    <div class="form-footer">
        <p>Немає акаунту? <a href="{% url 'register' %}">Зареєструватися</a></p>
    </div>
</div>

<style>
    .form-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .form-header i {
        font-size: 3rem;
        color: #667eea;
        margin-bottom: 1rem;
    }
    
    .form-header h2 {
        color: #333;
        margin-bottom: 0.5rem;
    }
    
    .form-header p {
        color: #666;
    }
    
    .auth-form {
        max-width: 400px;
        margin: 0 auto;
    }
    
    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
    }
    
    .checkbox {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
    }
    
    .forgot-password {
        color: #667eea;
        text-decoration: none;
        transition: color 0.3s;
    }
    
    .forgot-password:hover {
        color: #764ba2;
    }
    
    .form-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #e0e0e0;
    }
    
    .form-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }
    
    .form-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
