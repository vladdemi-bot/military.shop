{% extends 'shop/base.html' %} {% load static %} {% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2><i class="fas fa-sign-in-alt"></i> Вхід</h2>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Ім'я користувача</label>
                <input type="text" name="username" id="username" required placeholder="Введіть ім'я">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" name="password" id="password" required placeholder="Введіть пароль">
            </div>

            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt"></i> Увійти
            </button>
        </form>

        <p class="auth-link">
            Немає акаунта? <a href="{% url 'shop:register' %}">Зареєструватися</a>
        </p>
    </div>
</div>

<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        padding: 2rem;
    }
    
    .auth-card {
        background: #222;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        padding: 2.5rem;
        width: 100%;
        max-width: 450px;
    }
    
    .auth-card h2 {
        color: #8B9A46;
        text-align: center;
        margin-bottom: 2rem;
        font-size: 1.8rem;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #d4d4d4;
        font-weight: 500;
    }
    
    .form-group label i {
        margin-right: 8px;
        color: #8B9A46;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #d4d4d4;
        font-size: 1rem;
        transition: all 0.3s;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #8B9A46;
        box-shadow: 0 0 8px rgba(139, 154, 70, 0.3);
    }
    
    .btn-auth {
        width: 100%;
        padding: 12px;
        background: #4a5f2e;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-auth:hover {
        background: #3a4f1e;
        transform: translateY(-2px);
    }
    
    .auth-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #888;
    }
    
    .auth-link a {
        color: #8B9A46;
        text-decoration: none;
    }
    
    .auth-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
